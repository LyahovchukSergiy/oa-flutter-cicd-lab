# Лабораторія маскування. Запускається тільки руками.
#
# GitHub замінює в логах на *** те значення, яке зареєстроване як секрет.
# Питання, на яке цей workflow відповідає прогоном, а не вірою:
# що саме вважається «тим значенням».
#
# Секрет BOARD_TOKEN у цьому репозиторії навмисно фальшивий і нічого
# не відмикає. Інакше такий експеримент ставити не можна.
name: Secrets lab

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  masking:
    name: Що саме маскується
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      TOKEN: ${{ secrets.BOARD_TOKEN }}

    steps:
      - name: 1. Значення цілком
        run: |
          echo "цілком      -> $TOKEN"

      - name: 2. Перші пʼять символів
        run: |
          echo "підрядок    -> ${TOKEN:0:5}"

      - name: 3. Те саме в base64
        run: |
          echo "base64      -> $(printf '%s' "$TOKEN" | base64)"

      - name: 4. Задом наперед
        run: |
          echo "реверс      -> $(printf '%s' "$TOKEN" | rev)"

      - name: 5. Через файл
        run: |
          printf '%s' "$TOKEN" > token.txt
          echo "з файла     -> $(cat token.txt)"

      - name: 6. По одному символу
        run: |
          echo "посимвольно -> $(printf '%s' "$TOKEN" | sed 's/./& /g')"

      - name: 7. Усередині JSON
        run: |
          jq -n --arg t "$TOKEN" '{token: $t}'

      # Артефакти не проходять через маскування взагалі.
      # Файл із секретом, покладений в артефакт, качає будь-хто,
      # хто бачить репозиторій.
      - name: 8. У файлі артефакта
        uses: actions/upload-artifact@v6
        with:
          name: leak-lab
          path: token.txt
          retention-days: 1
